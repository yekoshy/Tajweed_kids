<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>فتوحات الرحمن — تطبيق التجويد للأطفال</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap');
:root{--bg:#f8fbff;--card:#fff;--ink:#172033;--muted:#657084;--accent:#1769aa;--soft:#eaf4ff;--good:#198754}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Almarai",sans-serif;direction:rtl}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #dfe7ef;padding:14px 18px}
.top{max-width:1200px;margin:auto;display:flex;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:clamp(24px,4vw,38px);margin:0;font-weight:800}
button,.navbtn{font-family:inherit;border:0;border-radius:14px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}
select{font:inherit;padding:11px;border-radius:12px;border:1px solid #ccd6e0;background:#fff}
main{max-width:1050px;margin:25px auto;padding:0 16px}
.card{background:var(--card);border:1px solid #dfe7ef;border-radius:22px;padding:24px;margin:18px 0;box-shadow:0 6px 22px #16324a0d}
.lesson-text{font-size:clamp(25px,3.2vw,38px);line-height:2.05;letter-spacing:.01em}
.lesson-text p{margin:0 0 18px}
.exercise{font-size:17px;line-height:1.8;filter:blur(3.2px);transition:.2s;user-select:none}
.exercise.reveal{filter:none;user-select:text}
.exercise-note{text-align:center;color:var(--muted);font-size:14px}
.q{border-top:1px dashed #ccd6e0;padding:16px 0}
.q input{font:inherit;padding:9px;border:1px solid #ccd6e0;border-radius:10px;max-width:150px}
.score{margin-top:16px;padding:14px;border-radius:14px;background:var(--soft);font-weight:800}
.pager{display:flex;gap:10px;justify-content:space-between;position:sticky;bottom:12px}
.small{color:var(--muted);font-size:14px}
.page-tag{display:inline-block;background:#edf2f7;padding:6px 10px;border-radius:999px;font-size:13px}
.poem-line{font-size:clamp(26px,4vw,42px);line-height:2.3;text-align:center;padding:12px;border-bottom:1px solid #e7edf3}
nav{display:flex;gap:8px;overflow:auto;padding:8px 0;max-width:1200px;margin:auto}
nav button{white-space:nowrap;background:#eef5fb;color:var(--ink)}
nav button.active{background:var(--accent);color:#fff}
footer{text-align:center;padding:35px;color:var(--muted)}
@media(max-width:650px){.card{padding:17px}.top{align-items:flex-start}.top select{max-width:45vw}}
</style>
</head>

function grade(){
