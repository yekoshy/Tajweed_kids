<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فتوحات الرحمن في تيسير تجويد القرآن للأطفال</title>
    
    <!-- استدعاء خط Almarai من Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* إعدادات الخطوط والتنسيقات الأساسية */
        :root {
            --primary: #FF6F00;
            --secondary: #00838F;
            --background: #FFF9C4;
            --card-bg: #FFFFFF;
            --text-dark: #212121;
            --success: #388E3C;
            --danger: #D32F2F;
        }

        body {
            font-family: "Almarai", sans-serif;
            background-color: var(--background);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
        }

        /* تنسيقات الأوزان */
        .almarai-light { font-weight: 300; }
        .almarai-regular { font-weight: 400; }
        .almarai-bold { font-weight: 700; }
        .almarai-extrabold { font-weight: 800; }

        /* الشريط الجانبي (القائمة) */
        #sidebar {
            width: 300px;
            background-color: var(--secondary);
            color: white;
            padding: 20px 10px;
            box-shadow: -4px 0 10px rgba(0,0,0,0.1);
            overflow-y: auto;
        }

        #sidebar h2 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 30px;
            color: #FFF59D;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .nav-btn {
            display: block;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid transparent;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 12px;
            font-size: 20px;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            text-align: right;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-5px);
        }

        .nav-btn.active {
            background: var(--primary);
            border-color: #FFF;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        /* المحتوى الرئيسي */
        #main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .lesson-container {
            display: none;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            max-width: 900px;
            margin: 0 auto;
            border: 4px solid #E0E0E0;
        }

        .lesson-container.active {
            display: block;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .lesson-title {
            color: var(--primary);
            font-size: 40px;
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 3px dashed var(--primary);
            padding-bottom: 15px;
        }

        .lesson-text {
            font-size: 28px;
            line-height: 2.2;
            margin-bottom: 30px;
        }

        .quran-text {
            color: var(--success);
            font-size: 36px;
            font-weight: 800;
            text-align: center;
            background: #E8F5E9;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            border: 2px solid #81C784;
        }

        /* التدريبات */
        .exercise-section {
            background: #FFF3E0;
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #FFB74D;
            margin-top: 40px;
        }

        .exercise-title {
            color: var(--primary);
            font-size: 32px;
            text-align: center;
            margin-bottom: 20px;
        }

        .question {
            font-size: 26px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .option-btn {
            background: white;
            border: 3px solid #B0BEC5;
            padding: 15px 20px;
            font-size: 24px;
            font-family: inherit;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            text-align: right;
        }

        .option-btn:hover { background: #ECEFF1; }
        
        .option-btn.selected {
            border-color: var(--secondary);
            background: #E0F7FA;
        }
        .option-btn.correct {
            border-color: var(--success);
            background: #C8E6C9;
            color: var(--success);
        }
        .option-btn.wrong {
            border-color: var(--danger);
            background: #FFCDD2;
            color: var(--danger);
        }

        .check-btn {
            display: block;
            width: 100%;
            background: var(--primary);
            color: white;
            font-size: 28px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 800;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .check-btn:hover { background: #E65100; }

        .score-display {
            font-size: 32px;
            text-align: center;
            color: var(--success);
            font-weight: 800;
            margin-top: 20px;
            display: none;
        }

        /* المراجعة الشاملة */
        .revision-box {
            background: #E1F5FE;
            border: 3px solid #4FC3F7;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        .revision-box h3 { color: #0277BD; font-size: 30px; margin-top: 0; }

        /* تصميم للموبايل */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; height: auto; padding: 10px; display: flex; overflow-x: auto; flex-wrap: nowrap; }
            #sidebar h2 { display: none; }
            .nav-btn { width: auto; margin-left: 10px; flex-shrink: 0; font-size: 16px; padding: 10px;}
            #main-content { padding: 10px; }
            .lesson-container { padding: 20px; }
            .lesson-title { font-size: 28px; }
            .lesson-text, .question { font-size: 22px; }
            .quran-text { font-size: 26px; }
            .option-btn { font-size: 20px; }
        }
    </style>
</head>
<body>

    <!-- القائمة الجانبية -->

        <div id="nav-buttons"></div>

    <!-- المحتوى الرئيسي -->
    <div id="main-content">
        <!-- سيتم توليد محتوى الدروس والامتحانات هنا عبر الجافاسكريبت -->
    </div>

                            - <b>إدغام:</b> (يرملون) بغنة (ينمو) وبغير غنة (ل، ر).<br>
                            - <b>إقلاب:</b> ب.<br>
                            - <b>إخفاء حقيقي:</b> باقي الحروف الـ ١٥.
                        </div>
                    </div>
                    <div style="text-align:center; font-size: 30px; color: var(--primary);" class="almarai-extrabold">
                        أنت الآن مستعد للاختبار النهائي! 🏆
                    </div>
                `,
                exercises: []
            },
            {
                id: "final-test",
                title: "🏆 الاختبار النهائي الشامل 🏆",
                content: `
                    <div class="almarai-bold lesson-text" style="text-align: center; color: var(--secondary);">
                        أجب عن جميع الأسئلة التالية لتثبت أنك بطل التجويد!
                    </div>
                `,
                isFinal: true,
                exercises: [
                    { q: "ما مقدار غنة النون والميم المشددتين؟", options: ["حركة واحدة", "حركتان", "بدون غنة"], answer: 1 },
                    { q: "حرف الإقلاب هو:", options: ["الباء", "الميم", "النون"], answer: 0 },
                    { q: "كلمة (لَهُم مَّغْفِرَةٌ) بها حكم:", options: ["إظهار شفوي", "إخفاء شفوي", "إدغام مثلين صغير"], answer: 2 },
                    { q: "حروف الإظهار الحلقي هي:", options: ["يرملون", "ء، هـ، ع، ح، غ، خ", "ينمو"], answer: 1 },
                    { q: "الحكم في (مِن رَّبِّهِمْ) هو:", options: ["إدغام بغير غنة", "إدغام بغنة", "إخفاء"], answer: 0 },
                    { q: "الحكم في (مِنۢ بَعْدِ) هو:", options: ["إظهار", "إقلاب", "إخفاء"], answer: 1 },
                    { q: "الحكم في (الْحَمْدُ لِلَّهِ) هو:", options: ["إخفاء شفوي", "إظهار شفوي", "إدغام"], answer: 1 },
                    { q: "حروف الإدغام بغنة هي:", options: ["ل ، ر", "ي ، ن ، م ، و", "ب ، ت ، ث"], answer: 1 },
                    { q: "الحكم في (مِن سِجِّيلٍ) هو:", options: ["إخفاء حقيقي", "إظهار حلقي", "إقلاب"], answer: 0 },
                    { q: "الحكم في (عَلَيْهِم بِوَكِيلٍ) هو:", options: ["إخفاء شفوي", "إظهار شفوي", "إدغام متماثلين"], answer: 0 }
                ]
            }
        ];

        // متغيرات الحالة
        let userAnswers = {}; 
        let scores = {};

        // تهيئة واجهة المستخدم
        function initApp() {
            const sidebar = document.getElementById("nav-buttons");
            const mainContent = document.getElementById("main-content");

            data.forEach((item, index) => {
                // إنشاء أزرار القائمة
                const btn = document.createElement("button");
                btn.className = "nav-btn" + (index === 0 ? " active" : "");
                btn.innerText = item.title.split('.')[0] + (item.title.includes('.') ? " - " + item.title.split('.')[1].substring(0, 15) + ".." : item.title);
                btn.onclick = () => showLesson(item.id, btn);
                sidebar.appendChild(btn);

                // إنشاء أقسام الدروس
                const section = document.createElement("div");
                section.id = item.id;
                section.className = "lesson-container" + (index === 0 ? " active" : "");
                
                let html = `<h1 class="lesson-title almarai-extrabold">${item.title}</h1>`;
                html += item.content;

                // إضافة التدريبات إن وجدت
                if (item.exercises && item.exercises.length > 0) {
                    html += `<div class="exercise-section">
                        <h2 class="exercise-title almarai-extrabold">✏️ تدريبات الدرس ✏️</h2>
                        <div id="quiz-${item.id}">`;
                    
                    item.exercises.forEach((ex, qIndex) => {
                        html += `
                            <div class="question-block" id="qb-${item.id}-${qIndex}">
                                <div class="question">${qIndex + 1}. ${ex.q}</div>
                                <div class="options">
                                    ${ex.options.map((opt, optIndex) => `
                                        <button class="option-btn" onclick="selectOption('${item.id}', ${qIndex}, ${optIndex}, this)">
                                            ${opt}
                                        </button>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    });

                    html += `</div>
                        <button class="check-btn" onclick="checkAnswers('${item.id}')">اختبر إجاباتي ✔️</button>
                        <div id="score-${item.id}" class="score-display"></div>
                    </div>`;
                }

                section.innerHTML = html;
                mainContent.appendChild(section);
            });
        }

        // التنقل بين الدروس
        function showLesson(id, btnElement) {
            // إخفاء الكل
            document.querySelectorAll(".lesson-container").forEach(el => el.classList.remove("active"));
            document.querySelectorAll(".nav-btn").forEach(el => el.classList.remove("active"));
            
            // إظهار المطلوب
            document.getElementById(id).classList.add("active");
            btnElement.classList.add("active");
            window.scrollTo(0, 0);
        }

        // اختيار إجابة
        function selectOption(lessonId, qIndex, optIndex, btnElement) {
            if (!userAnswers[lessonId]) userAnswers[lessonId] = {};
            userAnswers[lessonId][qIndex] = optIndex;

            // إزالة التحديد السابق في نفس السؤال
            const parent = btnElement.parentElement;
            parent.querySelectorAll(".option-btn").forEach(btn => btn.classList.remove("selected"));
            
            // تحديد الحالي
            btnElement.classList.add("selected");
        }

        // فحص الإجابات وحساب النتيجة
        function checkAnswers(lessonId) {
            const lessonData = data.find(d => d.id === lessonId);
            let score = 0;
            let answeredAll = true;

            lessonData.exercises.forEach((ex, qIndex) => {
                const selected = userAnswers[lessonId] ? userAnswers[lessonId][qIndex] : undefined;
                const parent = document.getElementById(`qb-${lessonId}-${qIndex}`).querySelector('.options');
                const buttons = parent.querySelectorAll('.option-btn');

                if (selected === undefined) {
                    answeredAll = false;
                } else {
                    // تفريغ الألوان السابقة
                    buttons.forEach(b => { b.classList.remove('correct', 'wrong'); });

                    if (selected === ex.answer) {
                        score++;
                        buttons[selected].classList.add('correct');
                    } else {
                        buttons[selected].classList.add('wrong');
                        buttons[ex.answer].classList.add('correct');
                    }
                }
            });

            if (!answeredAll) {
                alert("رجاءً أجب على جميع الأسئلة قبل الفحص يا بطل! 🤓");
                return;
            }

            scores[lessonId] = score;
            const scoreDiv = document.getElementById(`score-${lessonId}`);
            scoreDiv.style.display = "block";
            
            if (score === lessonData.exercises.length) {
                scoreDiv.innerHTML = `🌟 ممتاز! علامتك الكاملة: ${score} / ${lessonData.exercises.length} 🌟`;
                scoreDiv.style.color = "var(--success)";
            } else {
                scoreDiv.innerHTML = `👍 جيد! علامتك: ${score} / ${lessonData.exercises.length} - راجع الإجابات الصحيحة بالأخضر.`;
                scoreDiv.style.color = "var(--primary)";
            }
        }

        // بدء تشغيل التطبيق عند التحميل
        window.onload = initApp;

    </script>
</body>
</html>
